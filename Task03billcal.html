<body>
    <h1>Electricity Bill Calculator</h1>
    <script>
let units = 250;
 let rate = 0;

 if(units <= 100){
    rate = 10;
 }
 else if (units <=200){
    rate= 20;
 }
 else if(units<=300){
    rate = 30;
 }
 else{
    rate =40;
 }
 
 let TotalBill = units * rate;
console.log ("totalBill:   "+TotalBill );
 </script>
