<body>
    <h1>Weekday & Weekend Checker:</h1>
<script>
  
let day = "saturday";

switch (day) {
  case "monday":
  case "tuesday":
  case "wednesday":
  case "thursday":
  case "friday":
    console.log(day + " is a Weekday.");
    break;

  case "saturday":
  case "sunday":
    console.log(day + " is a Weekend.");
    break;

  default:
    console.log("Invalid day entered.");
}
 </script>
</body>
</html>
